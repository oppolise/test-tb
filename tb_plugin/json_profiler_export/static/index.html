<!DOCTYPE html>
<html>
<head>
    <title>JSON Profiler Export</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            color: #333;
            background-color: #f4f4f4;
        }
        .sidebar {
            width: 250px;
            background-color: #e9e9e9;
            padding: 15px;
            height: 100%;
            overflow-y: auto;
            border-right: 1px solid #ccc;
        }
        .sidebar h2 {
            font-size: 1.2em;
            margin-top: 0;
            margin-bottom: 10px;
            color: #111;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }
        .sidebar ul {
            list-style-type: none;
            padding: 0;
            margin: 0 0 20px 0;
        }
        .sidebar ul li {
            padding: 8px 0px;
            cursor: pointer;
            border-radius: 3px;
        }
        .sidebar ul li:hover:not(.active) {
            background-color: #ddd;
        }
        .sidebar ul li.active {
            background-color: #007bff;
            color: white;
            padding-left: 5px;
        }
        .sidebar .run-info, .sidebar .worker-info {
            font-size: 0.9em;
            word-wrap: break-word;
            padding-left: 10px;
        }

        .main-content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #fff;
        }
        .main-content h1 {
            margin-top: 0;
        }
        #dagViewContent {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #eee;
            background-color: #f9f9f9;
            white-space: pre-wrap; /* To respect newlines and spaces */
            font-family: monospace;
            min-height: 100px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            font-size: 16px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: red;
            font-weight: bold;
        }
        .processing-errors-list pre {
             white-space: pre-wrap;
             word-wrap: break-word;
             background-color: #ffe0e0;
             padding: 5px;
             border-radius: 3px;
             border: 1px solid #ffc0c0;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Runs</h2>
        <div id="runName" class="run-info"><p>Loading run...</p></div>

        <h2>Views</h2>
        <ul id="viewsList">
            <li id="viewDag">Dag</li>
        </ul>

        <h2>Workers</h2>
        <div id="workersList" class="worker-info"><p>Loading workers...</p></div>
        
        <hr>
        <a href="download_json_export" class="button" download>Download Full JSON</a>
    </div>

    <div class="main-content">
        <h1>Profiler Data View</h1>
        <div id="errorsContainer"></div>
        <div id="dagViewContent">
            <p>Select a view (e.g., Dag) to see data.</p>
        </div>
    </div>

    <script>
        let fullJsonData = null; // To store the fetched JSON data globally

        // Function to escape HTML special characters
        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') {
                try {
                    unsafe = JSON.stringify(unsafe);
                } catch (e) {
                    unsafe = String(unsafe); // Fallback
                }
            }
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        window.addEventListener('DOMContentLoaded', function() {
            const runNameDiv = document.getElementById('runName');
            const viewsListUl = document.getElementById('viewsList');
            const workersListDiv = document.getElementById('workersList');
            const dagViewContentDiv = document.getElementById('dagViewContent');
            const errorsContainerDiv = document.getElementById('errorsContainer');
            const viewDagLi = document.getElementById('viewDag');

            fetch('api/processed_info')
                .then(response => {
                    if (!response.ok) {
                        return response.text().then(text => {
                            let errorDetails = text;
                            try {
                                const jsonError = JSON.parse(text);
                                errorDetails = jsonError.error || jsonError.details || text;
                            } catch (e) { /* Not JSON, use text as is */ }
                            throw new Error(`HTTP error! status: ${response.status}, details: ${errorDetails}`);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    fullJsonData = data; // Store for later use by views

                    // Populate Runs
                    if (data.source_logdir) {
                        runNameDiv.innerHTML = `<p>${escapeHtml(data.source_logdir)}</p>`;
                    } else {
                        runNameDiv.innerHTML = '<p>N/A</p>';
                    }

                    // Populate Workers
                    let workersHtml = '';
                    if (data.successfully_processed_files && data.successfully_processed_files.length > 0) {
                        workersHtml += '<ul>';
                        data.successfully_processed_files.forEach(filename => {
                            workersHtml += `<li>${escapeHtml(filename)}</li>`;
                        });
                        workersHtml += '</ul>';
                    } else {
                        workersHtml = '<p>No workers found or processed.</p>';
                    }
                    workersListDiv.innerHTML = workersHtml;

                    // Populate Errors (if any)
                    if (data.errors && data.errors.length > 0) {
                        let errorsHtml = '<h3 class="error-message">Processing Errors:</h3><ul class="processing-errors-list">';
                        data.errors.forEach(errorMsg => {
                            errorsHtml += `<li><pre>${escapeHtml(errorMsg)}</pre></li>`;
                        });
                        errorsHtml += '</ul>';
                        errorsContainerDiv.innerHTML = errorsHtml;
                    }


                    // Initial message for Dag view (or clear it)
                    dagViewContentDiv.innerHTML = '<p>Click on "Dag" view to display JSON data snippet.</p>';

                })
                .catch(error => {
                    console.error('Error fetching initial info:', error);
                    const errorText = `<p class="error-message">Error loading initial data: ${escapeHtml(error.message)}</p>`;
                    runNameDiv.innerHTML = errorText;
                    workersListDiv.innerHTML = ''; // Clear workers list on error
                    errorsContainerDiv.innerHTML = errorText; // Show error in main area too
                    dagViewContentDiv.innerHTML = '';
                });

            // Attach event listener for Dag view
            viewDagLi.addEventListener('click', function() {
                // Highlight active view
                document.querySelectorAll('#viewsList li').forEach(li => li.classList.remove('active'));
                viewDagLi.classList.add('active');

                if (fullJsonData) {
                    try {
                        const jsonString = JSON.stringify(fullJsonData, null, 2); // Pretty print
                        const lines = jsonString.split('\n');
                        const first10Lines = lines.slice(0, 10).join('\n');
                        dagViewContentDiv.textContent = first10Lines; // Use textContent for pre-like display
                        if (lines.length > 10) {
                            dagViewContentDiv.textContent += '\n... (and more)';
                        }
                    } catch (e) {
                        dagViewContentDiv.textContent = `Error processing JSON data: ${escapeHtml(e.message)}`;
                        console.error("Error stringifying or slicing JSON for Dag view:", e);
                    }
                } else {
                    dagViewContentDiv.textContent = 'Data not yet loaded. Please wait or try refreshing.';
                }
            });
        });
    </script>
</body>
</html>
