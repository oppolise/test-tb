<!DOCTYPE html>
<html>
<head>
    <title>JSON Profiler Export</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh; /* Full viewport height */
            color: #333;
            background-color: #f8f9fa; /* Light gray background */
        }
        .sidebar {
            width: 280px; /* Slightly wider sidebar */
            background-color: #e9ecef; /* Light sidebar background */
            padding: 20px;
            height: 100vh; /* Full height */
            overflow-y: auto; /* Scroll if content overflows */
            border-right: 1px solid #dee2e6; /* Clearer separation */
            box-sizing: border-box;
        }
        .sidebar h2 {
            font-size: 1.3em; /* Larger heading */
            margin-top: 0;
            margin-bottom: 15px; /* More space below heading */
            color: #343a40; /* Darker heading color */
            border-bottom: 2px solid #007bff; /* Accent border */
            padding-bottom: 8px;
        }
        /* Removed .sidebar ul and .sidebar ul li styles as they are not used */
        .sidebar .run-info, .sidebar .worker-info { /* Kept if any old JS still refers, though likely not used */
            font-size: 0.9em;
            word-wrap: break-word;
            padding-left: 10px;
        }
        .sidebar-select {
            width: calc(100% - 12px); /* Adjust width considering padding */
            margin-bottom: 15px; /* More space between dropdowns */
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ced4da; /* Standard input border */
            background-color: #fff;
            box-sizing: border-box;
            font-size: 0.95em;
        }
        .sidebar-select:focus {
            border-color: #80bdff;
            outline: 0;
            box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
        }

        .main-content {
            flex-grow: 1;
            padding: 25px; /* More padding */
            overflow-y: auto; /* Scroll if content overflows */
            background-color: #ffffff; /* White main content area */
            height: 100vh;
            box-sizing: border-box;
        }
        .main-content h1 {
            margin-top: 0;
            margin-bottom: 20px; /* Space below main title */
            color: #212529; /* Dark main title */
        }
        #mainDataDisplayArea { /* Formerly #dagViewContent */
            margin-top: 15px;
            padding: 15px; /* More padding */
            border: 1px solid #e0e0e0; /* Lighter border */
            background-color: #fdfdfd; /* Slightly off-white for pre/table background */
            min-height: 150px; /* Taller min-height */
            overflow-x: auto; /* Allow horizontal scroll for wide tables/pre */
        }
        #mainDataDisplayArea pre {
            white-space: pre-wrap;
            word-wrap: break-word; /* Or use overflow-x: auto on pre itself */
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 0.875em;
            background-color: #f8f9fa; /* Light background for pre */
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            text-align: left;
            padding: 10px; /* Increased padding */
            border-bottom: 1px solid #dee2e6; /* Standard table border */
            vertical-align: top; /* Align content to top */
        }
        thead th {
            background-color: #e9ecef; /* Header background */
            color: #495057; /* Header text color */
            font-weight: bold; /* Bolder headers */
            position: sticky; /* Sticky headers for long tables */
            top: 0;
            z-index: 10;
        }
        tbody tr:nth-child(odd) {
            background-color: #f8f9fa; /* Zebra striping for rows */
        }
        tbody tr:hover {
            background-color: #e2e6ea; /* Hover effect */
        }
        .button { /* Assuming this button is still used for download */
            display: inline-block;
            padding: 10px 15px; /* Adjusted padding */
            margin-top: 15px;
            font-size: 1em; /* Relative font size */
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: #dc3545; /* Bootstrap danger color */
            font-weight: bold;
            padding: 10px;
            background-color: #f8d7da; /* Light red background */
            border: 1px solid #f5c6cb; /* Reddish border */
            border-radius: 4px;
        }
        .processing-errors-list pre { /* If this is still used for global errors */
             white-space: pre-wrap;
             word-wrap: break-word;
             background-color: #ffe0e0; /* Keeping distinct error style */
             padding: 8px;
             border-radius: 4px;
             border: 1px solid #ffc0c0;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Runs</h2>
        <select id="runsDropdown" class="sidebar-select">
            <option value="">Loading runs...</option>
        </select>

        <h2>Views</h2>
        <select id="viewsDropdown" class="sidebar-select">
            <option value="">Select a view</option>
            <!-- Example View, can be populated by JS -->
            <option value="dag">Dag</option> 
        </select>

        <h2>Workers</h2>
        <select id="workersDropdown" class="sidebar-select">
            <option value="">Select a worker</option>
        </select>
        
        <hr>
        <a href="download_json_export" class="button" download>Download Full JSON</a>
    </div>

    <div class="main-content">
        <h1>Profiler Data View</h1>
        <div id="errorsContainer"></div>
        <div id="mainDataDisplayArea">
            <p>Select a run, worker, and view to see data.</p>
        </div>
    </div>

    <script>
        // Function to escape HTML special characters
        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') {
                try {
                    unsafe = JSON.stringify(unsafe);
                } catch (e) {
                    unsafe = String(unsafe); // Fallback
                }
            }
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        window.addEventListener('DOMContentLoaded', function() {
            const runsDropdown = document.getElementById('runsDropdown');
            const viewsDropdown = document.getElementById('viewsDropdown');
            const workersDropdown = document.getElementById('workersDropdown');
            
            const mainDataDisplayArea = document.getElementById('mainDataDisplayArea');
            const errorsContainerDiv = document.getElementById('errorsContainer'); // Keep for global errors if any

            function renderTable(parentElementId, tableData, columnsMetadata) {
                const parentElement = document.getElementById(parentElementId);
                if (!parentElement) {
                    console.error(`renderTable: Parent element with ID '${parentElementId}' not found.`);
                    return;
                }
                parentElement.innerHTML = ''; // Clear previous content

                if (!tableData || !tableData.data || !Array.isArray(tableData.data)) {
                    parentElement.innerHTML = '<p>No table data available or data is in incorrect format.</p>';
                    return;
                }
                
                if (tableData.data.length === 0) {
                    parentElement.innerHTML = '<p>Table is empty.</p>';
                    return;
                }

                const table = document.createElement('table');
                const thead = table.createTHead();
                const headerRow = thead.insertRow();
                
                let headers = [];
                if (columnsMetadata && Array.isArray(columnsMetadata) && columnsMetadata.length > 0) {
                    headers = columnsMetadata.map(col => col.name || col); // Assuming col might be string or obj
                } else if (tableData.metadata && tableData.metadata.columns && Array.isArray(tableData.metadata.columns)) {
                     headers = tableData.metadata.columns.map(col => col.name || col); // Extract name property
                } else {
                    // Infer from first data row
                    headers = Object.keys(tableData.data[0]);
                }

                if (headers.length === 0) {
                    parentElement.innerHTML = '<p>Could not determine table headers.</p>';
                    return;
                }

                headers.forEach(headerText => {
                    const th = document.createElement('th');
                    th.textContent = headerText;
                    headerRow.appendChild(th);
                });

                const tbody = table.createTBody();
                tableData.data.forEach(rowData => {
                    const row = tbody.insertRow();
                    headers.forEach(header => {
                        const cell = row.insertCell();
                        // Attempt to access data using the exact header string, then try lowercase for robustness
                        const value = rowData[header] !== undefined ? rowData[header] : rowData[header.toLowerCase()];
                        cell.textContent = value !== undefined ? value : '';
                    });
                });
                parentElement.appendChild(table);
            }
            
            function loadAndDisplayData() {
                const selectedRun = runsDropdown.value;
                const selectedWorker = workersDropdown.value;
                const selectedView = viewsDropdown.value;

                // Validate selections
                if (!selectedRun || runsDropdown.options[runsDropdown.selectedIndex]?.disabled ||
                    !selectedWorker || workersDropdown.options[workersDropdown.selectedIndex]?.disabled ||
                    !selectedView || viewsDropdown.options[viewsDropdown.selectedIndex]?.disabled) {
                    mainDataDisplayArea.innerHTML = '<p>Please make valid selections in all dropdowns.</p>';
                    return;
                }

                mainDataDisplayArea.innerHTML = '<p>Loading data...</p>';

                fetch(`/api/data?run=${encodeURIComponent(selectedRun)}&worker=${encodeURIComponent(selectedWorker)}`)
                    .then(response => {
                        if (!response.ok) {
                             return response.json().then(err => { throw new Error(err.error || `HTTP error ${response.status}`) });
                        }
                        return response.json();
                    })
                    .then(workerData => {
                        mainDataDisplayArea.innerHTML = ''; // Clear loading message
                        if (workerData.status === 'error') {
                            mainDataDisplayArea.innerHTML = `<p class="error-message">Error loading data for worker: ${escapeHtml(workerData.error_message)}</p>`;
                            return;
                        }

                        switch (selectedView) {
                            case 'overview':
                                if (workerData.overview) {
                                    const overviewContent = document.createElement('pre');
                                    overviewContent.textContent = JSON.stringify(workerData.overview, null, 2);
                                    mainDataDisplayArea.appendChild(overviewContent);
                                } else {
                                    mainDataDisplayArea.innerHTML = '<p>Overview data not available.</p>';
                                }
                                break;
                            case 'op_table':
                                if (workerData.operation_table_by_name) {
                                    renderTable('mainDataDisplayArea', workerData.operation_table_by_name);
                                } else {
                                    mainDataDisplayArea.innerHTML = '<p>Operator Table data not available.</p>';
                                }
                                break;
                            case 'kernel_table':
                                 if (workerData.kernel_table && workerData.kernel_table.data) { // Assuming kernel_table also has .data
                                    // If you want to use renderTable for kernel_table:
                                    // renderTable('mainDataDisplayArea', workerData.kernel_table);
                                    const kernelTableContent = document.createElement('pre');
                                    kernelTableContent.textContent = JSON.stringify(workerData.kernel_table, null, 2);
                                    mainDataDisplayArea.appendChild(kernelTableContent);
                                } else {
                                    mainDataDisplayArea.innerHTML = '<p>Kernel Table data not available.</p>';
                                }
                                break;
                            case 'memory_view':
                                if (workerData.memory_summary || workerData.memory_curve) {
                                    const memoryContent = document.createElement('pre');
                                    memoryContent.textContent = `Memory Summary:\n${JSON.stringify(workerData.memory_summary, null, 2)}\n\nMemory Curve:\n${JSON.stringify(workerData.memory_curve, null, 2)}`;
                                    mainDataDisplayArea.appendChild(memoryContent);
                                } else {
                                    mainDataDisplayArea.innerHTML = '<p>Memory data not available.</p>';
                                }
                                break;
                            case 'trace_view':
                                if (workerData.trace_file_location) {
                                    mainDataDisplayArea.innerHTML = `<p>Trace file location: ${escapeHtml(workerData.trace_file_location)}</p><p>(Trace view UI not implemented in this exporter; download the file and use Perfetto or compatible viewer)</p>`;
                                } else {
                                    mainDataDisplayArea.innerHTML = '<p>Trace file location not available.</p>';
                                }
                                break;
                            default:
                                mainDataDisplayArea.innerHTML = `<p>View '${selectedView}' not implemented yet or data not available.</p>`;
                        }
                    })
                    .catch(error => {
                        console.error(`Error fetching data for run ${selectedRun}, worker ${selectedWorker}:`, error);
                        mainDataDisplayArea.innerHTML = `<p class="error-message">Error loading data: ${escapeHtml(error.message)}. Check console.</p>`;
                    });
            }


            function populateWorkersDropdown() {
                const selectedRun = runsDropdown.value;
                workersDropdown.innerHTML = ''; 

                if (!selectedRun || runsDropdown.options[runsDropdown.selectedIndex]?.disabled) {
                    const placeholderOption = document.createElement('option');
                    placeholderOption.value = "";
                    placeholderOption.textContent = "Select run first";
                    placeholderOption.disabled = true;
                    placeholderOption.selected = true;
                    workersDropdown.appendChild(placeholderOption);
                    loadAndDisplayData(); // Update display based on invalid worker selection
                    return;
                }

                const loadingOption = document.createElement('option');
                loadingOption.textContent = "Loading workers...";
                loadingOption.disabled = true;
                workersDropdown.appendChild(loadingOption);

                fetch(`/api/workers?run=${encodeURIComponent(selectedRun)}`)
                    .then(response => {
                        if (!response.ok) {
                            return response.json().then(err => { throw new Error(err.error || `HTTP error ${response.status}`) });
                        }
                        return response.json();
                    })
                    .then(workers => {
                        workersDropdown.innerHTML = ''; 
                        if (workers && Array.isArray(workers) && workers.length > 0) {
                            workers.forEach(workerId => {
                                const option = document.createElement('option');
                                option.value = workerId;
                                option.textContent = workerId;
                                workersDropdown.appendChild(option);
                            });
                            if (workersDropdown.options.length > 0) {
                                workersDropdown.selectedIndex = 0; 
                                loadAndDisplayData(); // Load data for the first worker
                            }
                        } else {
                            const option = document.createElement('option');
                            option.value = "";
                            option.textContent = "No workers found";
                            option.disabled = true;
                            workersDropdown.appendChild(option);
                            loadAndDisplayData(); // Update display (no workers)
                        }
                    })
                    .catch(error => {
                        console.error(`Error fetching workers for run ${selectedRun}:`, error);
                        workersDropdown.innerHTML = ''; 
                        const option = document.createElement('option');
                        option.value = "";
                        option.textContent = "Error loading workers";
                        option.disabled = true;
                        workersDropdown.appendChild(option);
                        loadAndDisplayData(); // Update display (error state)
                    });
            }

            function populateRunsDropdown() {
                fetch('/api/runs')
                    .then(response => {
                        if (!response.ok) {
                            return response.json().then(err => { throw new Error(err.error || `HTTP error ${response.status}`) });
                        }
                        return response.json();
                    })
                    .then(runs => {
                        runsDropdown.innerHTML = ''; 
                        if (runs && runs.length > 0) {
                            runs.forEach(runName => {
                                const option = document.createElement('option');
                                option.value = runName;
                                option.textContent = runName;
                                runsDropdown.appendChild(option);
                            });
                            if (runsDropdown.options.length > 0) {
                                runsDropdown.selectedIndex = 0; 
                                populateWorkersDropdown(); 
                            }
                        } else {
                            const option = document.createElement('option');
                            option.value = "";
                            option.textContent = "No runs found";
                            option.disabled = true;
                            runsDropdown.appendChild(option);
                            populateWorkersDropdown(); 
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching runs:', error);
                        runsDropdown.innerHTML = ''; 
                        const option = document.createElement('option');
                        option.value = "";
                        option.textContent = "Error loading runs";
                        option.disabled = true;
                        runsDropdown.appendChild(option);
                        populateWorkersDropdown(); 
                    });
            }
            
            function populateViewsDropdown() {
                viewsDropdown.innerHTML = ''; 
                const views = [
                    { value: 'overview', label: 'Overview' },
                    { value: 'op_table', label: 'Operator Table' },
                    { value: 'kernel_table', label: 'Kernel Table' },
                    { value: 'memory_view', label: 'Memory View' },
                    { value: 'trace_view', label: 'Trace View (experimental)' }
                ];

                views.forEach(view => {
                    const option = document.createElement('option');
                    option.value = view.value;
                    option.textContent = view.label;
                    viewsDropdown.appendChild(option);
                });

                if (views.length > 0) {
                    viewsDropdown.value = views[0].value; 
                    // loadAndDisplayData(); // Call loadAndDisplayData after views are populated and default is set
                }
            }
            
            // Add event listeners to call loadAndDisplayData
            runsDropdown.addEventListener('change', () => {
                 populateWorkersDropdown(); // This will call loadAndDisplayData after workers are populated
            });
            workersDropdown.addEventListener('change', loadAndDisplayData);
            viewsDropdown.addEventListener('change', loadAndDisplayData);
            
            // Initial population
            populateRunsDropdown(); // This will trigger populateWorkersDropdown, which then triggers loadAndDisplayData
            populateViewsDropdown();
            // A final explicit call to loadAndDisplayData might be needed if populateViewsDropdown was async or
            // if the very first state needs to be loaded after all dropdowns are certainly populated.
            // However, the chain from populateRunsDropdown -> populateWorkersDropdown -> loadAndDisplayData should cover it.
            // Call loadAndDisplayData once after all initial dropdowns are populated to ensure initial view.
            // This timeout helps ensure all prior setup (especially defaults) is complete.
            setTimeout(loadAndDisplayData, 0);


            // --- Cleanup of old JS logic ---
            // Remove or comment out the fetch to 'api/processed_info' and its .then/.catch blocks
            // For example:
            /*
            fetch('api/processed_info')
                .then(...)
                .catch(...);
            */
            // The global `fullJsonData` is no longer needed with the new API structure.
            // The errorsContainerDiv can still be used for global errors, or errors from loadAndDisplayData.

            // The old dagViewContentDiv is now mainDataDisplayArea.
            // The old viewDagLi event listener is obsolete.
            
            // Ensure initial message in mainDataDisplayArea is appropriate
            if (!runsDropdown.value || runsDropdown.options[runsDropdown.selectedIndex]?.disabled) {
                 mainDataDisplayArea.innerHTML = '<p>Please select a run to begin.</p>';
            }


        });
    </script>
</body>
</html>
